apiVersion: v1
kind: Service
metadata:
  name: {{ include "redis-cluster.fullname" . }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    redis_cluster_name: {{ include "redis-cluster.fullname" . }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
    - name: gossip
      port: 16379
      targetPort: gossip
    {{- if .Values.tls.enabled }}
    - name: redis-tls
      port: {{ .Values.tls.port }}
      targetPort: redis-tls
    {{- end }}
