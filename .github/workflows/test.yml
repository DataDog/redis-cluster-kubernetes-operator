name: Test

on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install artifact scanner
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ripgrep
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Kubernetes 1.33 envtest binaries
        run: |
          assets="$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.0.0-20250626154428-7fd020cb5fc3 use 1.33.x --bin-dir "$RUNNER_TEMP/envtest" -p path)"
          echo "KUBEBUILDER_ASSETS=$assets" >> "$GITHUB_ENV"
      - name: Verify artifact safety scanner
        run: ci/cleanroom/test-verify-artifacts.sh
      - name: Verify bounded artifact collection
        run: ci/cleanroom/test-collect-artifacts.sh
      - name: Verify KIND version guard
        run: bash ci/cleanroom/test-kind-version.sh
      - name: Verify KIND cluster ownership
        run: bash ci/cleanroom/test-kind-ownership.sh
      - name: Verify local KIND cluster ownership
        run: bash scripts/test-local-kind-ownership.sh
      - name: Verify EKS cleanup behavior
        run: ci/cleanroom/cleanup-eks_test.sh
      - name: Verify third-party license inventory
        run: make verify-license-inventory
      - run: go test ./...

  chart-validation:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Lint and validate chart values
        run: |
          helm lint . --strict --kube-version 1.33.0
          helm template gizmo-compatibility . --kube-version 1.36.0 >/dev/null
          helm lint . --strict --kube-version 1.33.0 \
            --set operator.redisAuth.secretName=redis-auth \
            --set operator.replicaCount=2 \
            --set operator.leaderElection.enabled=true
          helm lint . --strict --kube-version 1.33.0 \
            --set operator.metrics.enabled=false \
            --set operator.metrics.service.enabled=false \
            --set operator.probes.enabled=false
          if helm template invalid-image . --kube-version 1.33.0 \
            --set operator.image.repository=https://invalid.example/operator; then
            echo "invalid image repository passed schema validation" >&2
            exit 1
          fi
          if helm template invalid-label . --kube-version 1.33.0 \
            --set-string 'toolbox.podLabels.app=invalid'; then
            echo "reserved toolbox label passed schema validation" >&2
            exit 1
          fi
      - name: Verify digest and image pull Secret rendering
        run: ci/test-chart-image-settings.sh

  pull-request-smoke:
    if: github.event_name == 'pull_request'
    name: In-process reconciler smoke (diagnostic)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install standard KIND
        run: go install sigs.k8s.io/kind@v0.30.0
      - name: Run in-process public smoke lane
        run: ci/run-e2e-lane.sh smoke

  cleanroom-kind-smoke:
    if: github.event_name == 'pull_request'
    name: Packaged operator clean-room KIND smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install artifact scanner
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ripgrep
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Install pinned KIND
        run: go install sigs.k8s.io/kind@v0.30.0
      - name: Run deployed-operator smoke
        env:
          CLEANROOM_RUN_ID: pr-${{ github.run_id }}-${{ github.run_attempt }}
          CLEANROOM_TEST_TIMEOUT: 40m
        run: ci/run-cleanroom.sh kind smoke
      - name: Scan failure artifacts before upload
        if: failure()
        id: scan
        run: ci/cleanroom/verify-artifacts.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.scan.outputs.safe == 'true'
        with:
          name: cleanroom-kind-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: cleanroom-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  scheduled-regression:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: In-process reconciler regression (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lane: [default, slow, bg-stuck, loadgen]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install standard KIND
        run: go install sigs.k8s.io/kind@v0.30.0
      - name: Run diagnostic regression lane
        run: ci/run-e2e-lane.sh "${{ matrix.lane }}"

  scheduled-cleanroom:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Packaged operator clean-room (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: smoke
            run_suffix: s
          - lane: packaging
            run_suffix: p
          - lane: lifecycle
            run_suffix: l
          - lane: topology
            run_suffix: t
          - lane: security
            run_suffix: x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install artifact scanner
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ripgrep
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Install pinned KIND
        run: go install sigs.k8s.io/kind@v0.30.0
      - name: Run clean-room lane in a fresh cluster
        env:
          CLEANROOM_RUN_ID: ci-${{ matrix.run_suffix }}-${{ github.run_id }}-${{ github.run_attempt }}
          CLEANROOM_TEST_TIMEOUT: 90m
        run: ci/run-cleanroom.sh kind "${{ matrix.lane }}"
      - name: Scan failure artifacts before upload
        if: failure()
        id: scan
        run: ci/cleanroom/verify-artifacts.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.scan.outputs.safe == 'true'
        with:
          name: cleanroom-kind-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: cleanroom-artifacts/
          if-no-files-found: ignore
          retention-days: 14
