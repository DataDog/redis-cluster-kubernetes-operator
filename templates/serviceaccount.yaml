{{- if .Values.operator.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "redis-cluster-kubernetes-operator.operatorServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redis-cluster-kubernetes-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
{{- end }}
{{- if and .Values.operator.serviceAccount.create .Values.toolbox.serviceAccount.create }}
---
{{- end }}
{{- if .Values.toolbox.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "redis-cluster-kubernetes-operator.toolboxServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redis-cluster-kubernetes-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: toolbox
automountServiceAccountToken: false
{{- end }}
