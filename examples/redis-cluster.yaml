apiVersion: v1
kind: Namespace
metadata:
  name: redis-cluster-example
---
apiVersion: v1
kind: Service
metadata:
  name: cache
  namespace: redis-cluster-example
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    redis_cluster_name: cache
  ports:
    - name: redis
      port: 6379
      targetPort: redis
    - name: gossip
      port: 16379
      targetPort: gossip
---
apiVersion: cache.datadoghq.com/v1
kind: RedisCluster
metadata:
  name: cache
  namespace: redis-cluster-example
  labels:
    # The controller mirrors this compatibility label onto the StatefulSet.
    chart_version: "0.1.0"
spec:
  primaries: 3
  replicas: 1
  restoreFrom: ""
  backupEnabled: false
  backupFrequency: 0
  statefulsetTemplate:
    spec:
      serviceName: cache
      replicas: 6
      # The operator coordinates Redis role changes and Pod replacement.
      # Prevent StatefulSet template-label updates from restarting every Pod.
      updateStrategy:
        type: OnDelete
      selector:
        matchLabels:
          app: redis-cluster
          chart_name: cache
          app.kubernetes.io/name: redis-cluster
          redis_cluster_name: cache
      template:
        spec:
          securityContext:
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: redis
              image: redis:8.6.0
              imagePullPolicy: IfNotPresent
              command: ["redis-server"]
              args:
                - --cluster-enabled
                - "yes"
                - --cluster-config-file
                - /data/nodes.conf
                - --cluster-node-timeout
                - "5000"
                - --cluster-announce-hostname
                - $(POD_NAME).$(REDIS_SERVICE_NAME).$(POD_NAMESPACE).svc
                - --dir
                - /data
                - --appendonly
                - "yes"
                - --port
                - "6379"
                - --bind
                - 0.0.0.0
                - --protected-mode
                - "no"
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: REDIS_SERVICE_NAME
                  value: cache
              ports:
                - name: redis
                  containerPort: 6379
                - name: gossip
                  containerPort: 16379
              readinessProbe:
                exec:
                  command: ["redis-cli", "-h", "127.0.0.1", "ping"]
                initialDelaySeconds: 3
                periodSeconds: 5
              livenessProbe:
                exec:
                  command: ["redis-cli", "-h", "127.0.0.1", "ping"]
                initialDelaySeconds: 15
                periodSeconds: 10
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
                runAsUser: 999
                runAsGroup: 999
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - name: data
                  mountPath: /data
      volumeClaimTemplates:
        - spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 1Gi
