apiVersion: v2
name: redis-cluster-kubernetes-operator
description: A Kubernetes operator for Redis Cluster lifecycle, topology, and failure recovery
type: application
version: 0.1.0
appVersion: "0.1.0"
# Kubernetes 1.33 remains the formal compatibility gate. The range is kept
# contiguous through 1.36, which is the Gizmo staging qualification target, so
# 1.34 and 1.35 clusters are not rejected by Helm before rendering; every
# version in the range is rendered by the chart matrix in CI.
kubeVersion: ">=1.33.0-0 <1.37.0-0"
home: https://github.com/DataDog/redis-cluster-kubernetes-operator
sources:
  - https://github.com/DataDog/redis-cluster-kubernetes-operator
maintainers:
  - name: Datadog
