name: Release

# Publishes the public image, both Helm charts (OCI) and release manifests for
# a vX.Y.Z tag. The `release` environment must require reviewer approval.

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/datadog/redis-cluster-kubernetes-operator
  CHART_REPO: oci://ghcr.io/datadog/charts

jobs:
  verify:
    name: Verify tagged source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor "$(git rev-parse HEAD)" refs/remotes/origin/main
      - name: Derive version from tag
        id: version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || {
            echo "tag must be vMAJOR.MINOR.PATCH, got $GITHUB_REF_NAME" >&2
            exit 1
          }
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Install pinned YAML parser
        run: |
          python3 -m venv "$RUNNER_TEMP/release-python"
          "$RUNNER_TEMP/release-python/bin/pip" install PyYAML==6.0.3
          echo "$RUNNER_TEMP/release-python/bin" >> "$GITHUB_PATH"
      - name: Install Kubernetes 1.33 envtest binaries
        run: |
          assets="$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.0.0-20250626154428-7fd020cb5fc3 use 1.33.x --bin-dir "$RUNNER_TEMP/envtest" -p path)"
          echo "KUBEBUILDER_ASSETS=$assets" >> "$GITHUB_ENV"
      - run: make verify-crd-contract verify-license-inventory
      - run: go test ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - run: |
          helm lint . --strict --kube-version 1.33.0
          ci/test-chart-image-settings.sh
          ci/test-instance-chart.sh
          ci/test-release.sh

  publish:
    name: Publish image, charts and manifests
    needs: verify
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse the candidate image on retries
        id: candidate
        run: |
          source ci/release-artifacts.sh
          candidate="$IMAGE:release-$VERSION-$GITHUB_SHA"
          digest="$(registry_digest "$candidate")"
          echo "ref=$candidate" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Build and push candidate multi-architecture image
        if: steps.candidate.outputs.digest == ''
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.candidate.outputs.ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          sbom: true
          provenance: mode=max
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Install pinned YAML parser
        run: |
          python3 -m venv "$RUNNER_TEMP/release-python"
          "$RUNNER_TEMP/release-python/bin/pip" install PyYAML==6.0.3
          echo "$RUNNER_TEMP/release-python/bin" >> "$GITHUB_PATH"
      - name: Select the image digest
        env:
          DIGEST: ${{ steps.candidate.outputs.digest || steps.build.outputs.digest }}
        run: echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
      - name: Prepare charts and release manifests
        run: ci/prepare-release.sh
      - name: Push charts without replacing existing versions
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source ci/release-artifacts.sh
          helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$REGISTRY_TOKEN"
          publish_chart "$RUNNER_TEMP/charts/redis-cluster-kubernetes-operator-$VERSION.tgz" redis-cluster-kubernetes-operator
          publish_chart "$RUNNER_TEMP/charts/redis-cluster-$VERSION.tgz" redis-cluster
      - name: Prepare the draft release and assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A completed release is left untouched on a retry.
          if ! gh release view "$GITHUB_REF_NAME" --json isDraft > "$RUNNER_TEMP/release.json"; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --draft
            gh release view "$GITHUB_REF_NAME" --json isDraft > "$RUNNER_TEMP/release.json"
          fi
          if jq -e '.isDraft' "$RUNNER_TEMP/release.json" >/dev/null; then
            gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/install.yaml" "$RUNNER_TEMP/crds.yaml" --clobber
          fi
      - name: Promote the image version without overwriting it
        run: |
          source ci/release-artifacts.sh
          promote_image
      - name: Publish the prepared release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: Summary
        run: |
          {
            echo "### Release $VERSION"
            echo "- Image: \`$IMAGE:$VERSION\` (\`$DIGEST\`)"
            echo "- Charts: \`$CHART_REPO/redis-cluster-kubernetes-operator\`, \`$CHART_REPO/redis-cluster\` ($VERSION)"
            echo "- Release assets: \`install.yaml\`, \`crds.yaml\`"
          } >> "$GITHUB_STEP_SUMMARY"
